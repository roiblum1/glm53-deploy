{{- /*
Token budget per client for this model. Targets the HTTPRoute the Agent Router
generates from the AIGatewayRoute (same name, same namespace), so every model
release owns its own policy. A Gateway accepts only one BackendTrafficPolicy;
per-model policies aimed at the shared Gateway would conflict.
Cost is taken from the llmRequestCosts metadata, so it is charged after the
response: the request that crosses the budget completes, the next one gets 429.
With crossSite on, metering moves to the tier-0 route and this lives in the
tier-0 policy in crosssite.yaml instead (one policy per route).
*/ -}}
{{- if and .Values.serving.enabled .Values.route.enabled .Values.rateLimit.enabled (not .Values.crossSite.enabled) }}
{{- $fullname := include "kserve-llm.fullname" . -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullname }}-token-limit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kserve-llm.labels" . | nindent 4 }}
  {{- with include "kserve-llm.annotations" (dict "root" . "wave" "policy") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $fullname }}
  {{- include "kserve-llm.rateLimit" . | nindent 2 }}
{{- end }}

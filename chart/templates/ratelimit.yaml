{{- /*
Token budget per client for this model. Targets the HTTPRoute the Agent Router
generates from the AIGatewayRoute (same name, same namespace), so every model
release owns its own policy. A Gateway accepts only one BackendTrafficPolicy;
per-model policies aimed at the shared Gateway would conflict.
Cost is taken from the llmRequestCosts metadata, so it is charged after the
response: the request that crosses the budget completes, the next one gets 429.
*/ -}}
{{- if and .Values.serving.enabled .Values.route.enabled .Values.rateLimit.enabled }}
{{- $fullname := include "kserve-llm.fullname" . -}}
{{- $limit := .Values.rateLimit -}}
{{- $costKeys := list -}}
{{- range .Values.route.llmRequestCosts }}{{ $costKeys = append $costKeys .metadataKey }}{{ end -}}
{{- if not (has $limit.costKey $costKeys) }}
{{- fail (printf "rateLimit.costKey %q is not a metadataKey in route.llmRequestCosts" $limit.costKey) }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullname }}-token-limit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kserve-llm.labels" . | nindent 4 }}
  {{- with include "kserve-llm.annotations" (dict "root" . "wave" "policy") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $fullname }}
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: {{ required "rateLimit.clientHeader is required" $limit.clientHeader }}
                  type: Distinct
                - name: x-ai-eg-model
                  type: Exact
                  value: {{ .Values.model.name }}
          limit:
            requests: {{ int64 $limit.tokens }}
            unit: {{ $limit.unit }}
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: {{ $limit.costKey }}
        {{- with $limit.extraRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}

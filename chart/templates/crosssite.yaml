{{- /*
Serving side of cross-site pooling. With crossSite on, the serving route moves to
the peer listener (aigatewayroute.yaml) and stops metering; tier 0, metering and
per-model membership live in the fleet release (fleet/), one per cluster.

This site's shed point: past requestsPerNode x len(nodes) in-flight requests
(split across the gateway's Envoy replicas) the gateway answers 503 at once and
the sender's tier 0 retries another site, instead of vLLM queueing without bound.
*/ -}}
{{- if and .Values.serving.enabled .Values.route.enabled .Values.crossSite.enabled }}
{{- $fullname := include "kserve-llm.fullname" . -}}
{{- $v := include "kserve-llm.crossSite" . | fromYaml -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullname }}-shed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kserve-llm.labels" . | nindent 4 }}
    app.kubernetes.io/component: cross-site
  {{- with include "kserve-llm.annotations" (dict "root" . "wave" "policy") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $fullname }}
  circuitBreaker:
    maxConnections: {{ $v.servingMaxParallel }}
    maxParallelRequests: {{ $v.servingMaxParallel }}
    maxPendingRequests: {{ .Values.crossSite.serving.maxPendingRequests }}
{{- end }}

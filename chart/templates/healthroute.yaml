{{- /*
Per-model health endpoint on the Agent Router gateway, for the GSLB monitor.
It answers 200 only while this site has a ready replica of the model, so the
GSLB pulls a site whose gateway is up but whose model is not. A monitor on the
gateway alone (or on /v1/models, which the gateway answers itself) cannot see that.
With crossSite on it is also attached to the peer listener: every site's fleet
tier 0 health-checks this path to decide whether this site serves the model.
*/ -}}
{{- if and .Values.serving.enabled .Values.healthRoute.enabled }}
{{- $fullname := include "kserve-llm.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kserve-llm.labels" . | nindent 4 }}
  {{- with include "kserve-llm.annotations" (dict "root" . "wave" "route") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      {{- with .Values.route.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
    {{- if .Values.crossSite.enabled }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ (include "kserve-llm.crossSite" . | fromYaml).peerListener }}
    {{- end }}
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: {{ .Values.healthRoute.path | default (printf "/healthz/%s" .Values.model.name) }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ .Values.healthRoute.backendPath }}
      backendRefs:
        {{- if .Values.healthRoute.backendRef }}
        - {{- toYaml .Values.healthRoute.backendRef | nindent 10 }}
        {{- else }}
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ $fullname }}-inference-pool
        {{- end }}
{{- end }}

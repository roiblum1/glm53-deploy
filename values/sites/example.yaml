# Per-cluster values. Copy to values/site.yaml and replace every value.

global:
  imageRegistry: REGISTRY            # internal registry host[/project]

nodes:                               # kubernetes.io/hostname of each serving node
  - b200-01
  - b200-02

tolerations: []                      # GPU-node taints, if any

modelPull:
  image:
    repository: tools/s3cmd
    tag: latest                      # pin this
  source: s3://models/zai-org/GLM-5.3/
  existingSecret: s3cmd-config       # secret with key s3cfg

route:
  gateway:                           # the Agent Router Gateway
    name: ai-gateway
    namespace: ai-gateway
    sectionName: https               # client listener; required with crossSite

argocd:
  enabled: true

rateLimit:
  enabled: true                      # needs the Envoy Gateway rate limit service + Redis
  clientHeader: x-tenant-id
  tokens: 2000000
  unit: Hour

healthRoute:
  enabled: true                      # GSLB monitor: GET /healthz/glm-5.3

benchmark:
  enabled: true
  image:
    repository: tools/aiperf
    tag: latest                      # pin this
  url: https://llm.site1.example.internal   # this site's gateway, not the global name
  apiKeySecret:
    name: aiperf-api-key

# Read by the fleet release (fleet/), not the model chart: the global name
# describes the gateway.
globalName:
  enabled: true
  fqdn: llm.example.internal         # the same on every site
  hostRule:
    namespace: envoy-gateway-system  # where the gateway's LoadBalancer Service lives
    localFqdn: llm.site1.example.internal
  gslbHostRule:
    create: true                     # AMKO leader cluster only; false on the other sites
    healthMonitorRefs:
      - fleet-gateway-health         # federated HTTPS monitor on Avi: GET /healthz/gateway -> 200

# Cross-site. Read by both charts: the model chart puts its serving route on
# peerListener and pins its benchmark to `self`; the fleet chart dials every
# site's peerListener with this client certificate. Needs the peer listener and
# certificates (fleet/README.md, pre-reqs).
crossSite:
  enabled: true                      # model chart: serve this model to the fleet
  self: site1                        # this site's name in values/fleet.yaml
  peerListener: peers                # mTLS listener on route.gateway for other sites
  tls:
    caCertificateRef: {kind: ConfigMap, name: llm-peer-ca}
    clientCertificateSecret: llm-peer-client
  serving:
    gatewayReplicas: 2               # Envoy replicas of ai-gateway on this cluster (fixed)
